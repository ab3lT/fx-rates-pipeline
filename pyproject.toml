[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-rates-etl"
version = "0.1.0"
description = "A small, production-shaped ETL pipeline for foreign exchange rates."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abel Tadesse" }]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.7",
    "tenacity>=8.2",
    "psycopg2-binary>=2.9",
    "python-dateutil>=2.8",
    "Flask>=3.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12"]
orchestration = ["prefect>=2.19"]

[project.scripts]
fx-etl = "fx_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fx_etl.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
