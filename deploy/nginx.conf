# nginx site for the FX dashboard. Replace fx.example.com with your domain, then:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fx-rates
#   sudo ln -s /etc/nginx/sites-available/fx-rates /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fx.example.com        # adds HTTPS and the redirect

server {
    listen 80;
    listen [::]:80;
    server_name fx.example.com;

    client_max_body_size 1m;

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
